services:
  database:
    image: postgres:17-alpine
    profiles: ["postgres-reference"]
    environment:
      POSTGRES_DB: pickleball_risk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pickleball_risk"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      MVP_ADMIN_EMAIL: ${MVP_ADMIN_EMAIL:?MVP_ADMIN_EMAIL is required}
      MVP_ADMIN_PASSWORD: ${MVP_ADMIN_PASSWORD:?MVP_ADMIN_PASSWORD is required}
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN is required}
      ALLOW_INSECURE_HTTP: ${ALLOW_INSECURE_HTTP:-false}
      HOSTNAME: 0.0.0.0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-sol}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-chi_sim+eng}
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-3000}:3000"
    volumes:
      - app-data:/app/.data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  app-data:
  postgres-data:
