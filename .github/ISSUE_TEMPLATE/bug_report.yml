name: 缺陷报告
description: 报告可复现的软件问题
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。安全漏洞请按 SECURITY.md 私下报告，不要在这里披露。
  - type: checkboxes
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，未发现重复问题
          required: true
        - label: 我已移除密钥、个人信息和客户数据
          required: true
  - type: input
    attributes:
      label: 版本
      description: 提交号、版本号或分支
      placeholder: v0.1.0 / commit SHA
    validations:
      required: true
  - type: textarea
    attributes:
      label: 运行环境
      description: 操作系统、Node.js 版本、浏览器和部署方式
    validations:
      required: true
  - type: textarea
    attributes:
      label: 复现步骤
      description: 请提供最小、稳定的复现步骤
    validations:
      required: true
  - type: textarea
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    attributes:
      label: 补充信息
      description: 可提供已脱敏日志、截图或相关链接
